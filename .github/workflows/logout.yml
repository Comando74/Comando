name: Logout Account

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email du compte (LOGOUT_EMAIL)"
        required: true
        type: string
      platform:
        description: "Plateforme (ex: tronpick)"
        required: true
        type: string
      userId:
        description: "Identifiant utilisateur (USER_ID)"
        required: true
        type: string
      password:
        description: "Mot de passe (non utilisé pour la déconnexion)"
        required: false
        type: string
        default: ""
      proxyIndex:
        description: "Index du proxy (non utilisé pour la déconnexion)"
        required: false
        type: string
        default: "0"

jobs:
  logout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/aliya123-pro/camoufox-system:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Exécuter le script de déconnexion
        working-directory: /app
        env:
          HOME: /home/camoxuser
          DISPLAY: ":99"
          LOGOUT_EMAIL: ${{ github.event.inputs.email }}
          LOGOUT_PLATFORM: ${{ github.event.inputs.platform }}
          USER_ID: ${{ github.event.inputs.userId }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_REPO: ${{ secrets.GH_REPO }}
          GH_BRANCH: ${{ secrets.GH_BRANCH || 'main' }}
          JP_PROXY_LIST: ${{ secrets.JP_PROXY_LIST }}
          CRYPTO_SECRET: ${{ secrets.CRYPTO_SECRET }}
        run: xvfb-run --auto-servernum python borita.py
