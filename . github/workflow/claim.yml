name: Claim Faucet

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email du compte (CLAIM_EMAIL)"
        required: true
        type: string
      platform:
        description: "Plateforme (ex: tronpick)"
        required: true
        type: string
      userId:
        description: "Identifiant utilisateur (USER_ID)"
        required: true
        type: string

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    container:
      image: ghcr.io/aliya123-pro/camoufox-system:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Exécuter le script de claim
        working-directory: /app
        env:
          HOME: /home/camoxuser
          DISPLAY: ":99"
          CLAIM_EMAIL: ${{ github.event.inputs.email }}
          CLAIM_PLATFORM: ${{ github.event.inputs.platform }}
          USER_ID: ${{ github.event.inputs.userId }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_REPO: ${{ secrets.GH_REPO }}
          GH_BRANCH: ${{ secrets.GH_BRANCH || 'main' }}
          JP_PROXY_LIST: ${{ secrets.JP_PROXY_LIST }}
          CRYPTO_SECRET: ${{ secrets.CRYPTO_SECRET }}
        run: |
          mkdir -p /app/videos
          xvfb-run --auto-servernum python voanjo.py

      - name: Upload des vidéos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claim-video-${{ github.run_id }}
          path: /app/videos/
          retention-days: 5
          if-no-files-found: warn
